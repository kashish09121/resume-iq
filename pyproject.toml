[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-iq"
version = "0.1.0"
description = "Automated Resume Analyzer"
authors = [
    {name = "Kashish", email = "Kashish09121@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pdfminer.six>=20231228",
    "python-docx>=1.1.0",
    "spacy>=3.7.4",
    "pydantic>=2.7.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "python-multipart>=0.0.9"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-cov>=5.0.0",
    "black>=24.3.0",
    "ruff>=0.3.5",
    "mypy>=1.9.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
